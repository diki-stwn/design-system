<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'row' },
      h(T.IconButton, { icon: 'more_vert', label: 'More' }), h(T.IconButton, { icon: 'edit', label: 'Edit', variant: 'secondary' }),
      h(T.IconButton, { icon: 'share', label: 'Share', variant: 'outline' }), h(T.IconButton, { icon: 'add', label: 'Add', variant: 'primary' }),
      h(T.IconButton, { icon: 'delete', label: 'Delete', destructive: true })),
    h('div', { className: 'row' },
      h(T.IconButton, { icon: 'edit', label: 'Edit', variant: 'secondary', size: 'sm' }), h(T.IconButton, { icon: 'edit', label: 'Edit', variant: 'secondary', size: 'lg' }),
      h(T.IconButton, { icon: 'edit', label: 'Edit', variant: 'secondary', shape: 'round' }), h(T.IconButton, { icon: 'edit', label: 'Edit', variant: 'secondary', size: 'lg', shape: 'round' })),
    h('div', { className: 'row' },
      h(T.Fab, { icon: 'add', label: 'New', position: 'static' }), h(T.Fab, { icon: 'add', label: 'Add', size: 'sm', position: 'static' }),
      h(T.Fab, { icon: 'edit', label: 'Compose', extended: true, position: 'static' }))
  ));
</script>
</body>
</html>
