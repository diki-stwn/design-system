<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tabs — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  #root { display: flex; flex-direction: column; gap: 20px; max-width: 520px; font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  function Set(props) {
    return h(T.Tabs, props,
      h(T.TabList, { 'aria-label': 'Project' }, h(T.Tab, { value: 'a' }, 'Overview'), h(T.Tab, { value: 'b', icon: 'history' }, 'Activity'), h(T.Tab, { value: 'c' }, 'Members'), h(T.Tab, { value: 'd', disabled: true }, 'Settings')),
      h(T.TabPanel, { value: 'a' }, 'Atlas is on track for the March release.'), h(T.TabPanel, { value: 'b' }, 'Activity'), h(T.TabPanel, { value: 'c' }, 'Members'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(Set, { defaultValue: 'a' }),
    h(Set, { defaultValue: 'b', variant: 'pill', size: 'sm' })
  ));
</script>
</body>
</html>
