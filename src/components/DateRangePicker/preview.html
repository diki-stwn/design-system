<!doctype html>
<html>
<head><meta charset="utf-8"><title>DateRangePicker — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  var a = new Date(2025, 2, 12), b = new Date(2025, 2, 16);   // fixed dates, so the visual baseline doesn't change from day to day
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Field, { label: 'Stay', hint: 'mm/dd/yyyy' }, h(T.DateRangePicker, { defaultValue: { start: a, end: b }, locale: 'en-US' })));
  setTimeout(function () { var x = document.querySelector('.dk-date-range-picker button'); if (x) x.click(); }, 50);
</script>
</body>
</html>
