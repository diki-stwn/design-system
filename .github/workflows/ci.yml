name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Pinned so font rendering, and with it the visual snapshots, stays the same between runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Every file carries the same version
        run: python3 tools/release.py --check
      - name: Test suite
        run: npm test
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: .test-tmp/
          if-no-files-found: ignore
