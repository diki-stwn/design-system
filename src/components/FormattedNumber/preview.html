<!doctype html>
<html>
<head><meta charset="utf-8"><title>FormattedNumber — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement, n = function (p) { return h(T.FormattedNumber, Object.assign({ locale: 'en-US' }, p)); };
  ReactDOM.createRoot(document.getElementById('root')).render(h('p', { style: { margin: 0 } },
    n({ value: 1234567, format: 'compact' }), ' views, ', n({ value: 0.456, format: 'percent' }), ' of them new. Total ',
    n({ value: 150000, format: 'currency', currency: 'IDR' }), ', ', n({ value: 1572864, format: 'bytes' }), ' at ', n({ value: 50, format: 'unit', unit: 'kilometer-per-hour' }), '.'));
</script>
</body>
</html>
