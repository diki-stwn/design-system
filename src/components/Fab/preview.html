<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fab — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 16px; }
  .lbl { width: 80px; font-size: 12px; color: var(--text-muted); }
  /* A small "screen" for the fixed positions: the transform makes it the box position: fixed is measured from. */
  .screen { position: relative; transform: translateZ(0); width: 360px; height: 200px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  function Row(label, kids) { return h('div', { className: 'row' }, h('span', { className: 'lbl' }, label), kids); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    Row('Sizes', [
      h(T.Fab, { key: 1, icon: 'add', label: 'New project', position: 'static', 'data-visual-target': '' }),
      h(T.Fab, { key: 2, icon: 'add', label: 'New project', size: 'sm', position: 'static' })
    ]),
    Row('Extended', [
      h(T.Fab, { key: 1, icon: 'edit', label: 'Compose', extended: true, position: 'static' }),
      h(T.Fab, { key: 2, icon: 'edit', label: 'Compose', extended: true, size: 'sm', position: 'static' })
    ]),
    Row('States', [
      h(T.Fab, { key: 1, icon: 'delete', label: 'Delete', destructive: true, position: 'static' }),
      h(T.Fab, { key: 2, icon: 'save', label: 'Saving', loading: true, position: 'static' }),
      h(T.Fab, { key: 3, icon: 'add', label: 'New project', disabled: true, position: 'static' })
    ]),
    Row('Positions', h('div', { className: 'screen' },
      h(T.Fab, { icon: 'add', label: 'Top start', size: 'sm', position: 'top-start' }),
      h(T.Fab, { icon: 'add', label: 'Top end', size: 'sm', position: 'top-end' }),
      h(T.Fab, { icon: 'chat', label: 'Bottom start', size: 'sm', position: 'bottom-start' }),
      h(T.Fab, { icon: 'add', label: 'Bottom end' })))
  ));
</script>
</body>
</html>
