<!-- @dsCard height=300 -->
<div class="cv">
  <svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
    <!-- blocks: primary 240x300 (follows the theme's brand), sky-400 120x180, amber-400 120x120, rose-500 120x120, surface-inverse 120x180 -->
    <!-- arrangement: unequal modular grid flush to the right edge, bleeding top and bottom -->
    <!-- pattern: dot grid at 48px pitch (primary-hover) cut into the primary slab; a utility-first, 4px-grid system: precise/technical row -->
    <!-- steps: 48px pitch (12 x 4px), 4px dots, square corners -->
    <rect class="b1" x="480" y="0" width="240" height="300"/>
    <rect class="b2" x="720" y="0" width="120" height="180"/>
    <rect class="b5" x="840" y="0" width="120" height="180"/>
    <rect class="b3" x="720" y="180" width="120" height="120"/>
    <rect class="b4" x="840" y="180" width="120" height="120"/>
    <g class="dot" id="d"></g>
  </svg>
  <div class="txt"><div class="name">Diki Design System</div><div class="tag">One set of foundations, six themes.</div></div>
</div>
<style>
html,body{margin:0;background:var(--surface)}
.cv{position:relative;width:960px;height:300px;overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;inset:0}
.b1{fill:var(--primary)}.b2{fill:var(--sky-400)}.b3{fill:var(--amber-400)}.b4{fill:var(--rose-500)}.b5{fill:var(--surface-inverse)}
.dot{fill:var(--primary-hover)}
.txt{position:absolute;left:40px;bottom:40px;max-width:440px}
.name{font-size:64px;font-weight:600;line-height:.95;letter-spacing:-.02em;color:var(--text)}
.tag{margin-top:14px;font-size:14px;color:var(--text-muted)}
</style>
<script>
const g=document.getElementById('d'),ns='http://www.w3.org/2000/svg';
for(let x=516;x<720;x+=48)for(let y=36;y<300;y+=48){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',2);g.appendChild(c);}
</script>
