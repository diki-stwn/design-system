<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip — preview</title>
<style>
  body { margin: 0; padding: 48px 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  #root { display: flex; gap: 120px; padding-left: 60px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(T.Tooltip, { content: 'Download as PDF', open: true }, h(T.IconButton, { icon: 'download', label: 'Download', variant: 'secondary', noTitle: true })),
    h(T.Tooltip, { content: 'Ctrl + S', open: true, placement: 'bottom' }, h(T.Button, { variant: 'secondary' }, 'Save'))
  ));
</script>
</body>
</html>
