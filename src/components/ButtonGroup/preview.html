<!-- @dsCard group="Actions" height=200 subtitle="attached or spaced; vertical; a toolbar of toggle buttons" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ButtonGroup — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  #root { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var D = window.Diki, h = React.createElement, B = D.Button, T = D.ToggleButton;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(D.ButtonGroup, { 'aria-label': 'Clipboard' }, h(B, { variant: 'outline', leftIcon: 'content_copy' }, 'Copy'), h(B, { variant: 'outline', leftIcon: 'content_cut' }, 'Cut'), h(B, { variant: 'outline', leftIcon: 'content_paste' }, 'Paste')),
    h(D.ButtonGroup, { attached: false }, h(B, { variant: 'outline' }, 'Cancel'), h(B, null, 'Save')),
    h(D.ButtonGroup, { 'aria-label': 'Text formatting' }, h(T, { icon: 'format_bold', 'aria-label': 'Bold', defaultPressed: true }), h(T, { icon: 'format_italic', 'aria-label': 'Italic' }), h(T, { icon: 'format_underlined', 'aria-label': 'Underline' }))
  ));
</script>
</body>
</html>
