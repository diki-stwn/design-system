<!doctype html>
<html>
<head><meta charset="utf-8"><title>Breadcrumb — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  #root { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var D = window.Serupa, h = React.createElement, I = D.BreadcrumbItem;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(D.Breadcrumb, { 'aria-label': 'Chevron' }, h(I, { href: '#', icon: 'home' }, 'Home'), h(I, { href: '#' }, 'Projects'), h(I, null, 'Website redesign')),
    h(D.Breadcrumb, { separator: 'slash', 'aria-label': 'Slash' }, h(I, { href: '#' }, 'Settings'), h(I, { href: '#' }, 'Team'), h(I, null, 'Members')),
    h(D.Breadcrumb, { maxItems: 3, 'aria-label': 'Collapsed' }, ['Home', 'Acme', 'Design', 'Projects', 'Website', 'Settings'].map(function (l, i) { return h(I, { key: l, href: i < 5 ? '#' : undefined }, l); }))
  ));
</script>
</body>
</html>
