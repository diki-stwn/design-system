<!doctype html>
<html>
<head><meta charset="utf-8"><title>NumberInput — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 240 } },
    h(T.NumberInput, { 'aria-label': 'Quantity', defaultValue: 1, min: 1, max: 99 }),
    h(T.NumberInput, { 'aria-label': 'Price', defaultValue: 9.5, step: 0.25, leftIcon: 'attach_money' }),
    h(T.NumberInput, { 'aria-label': 'Year', defaultValue: 2026, steppers: false })));
</script>
</body>
</html>
