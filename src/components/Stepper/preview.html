<!doctype html>
<html>
<head><meta charset="utf-8"><title>Stepper — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  var steps = [{ title: 'Account', description: 'Email and password' }, { title: 'Profile' }, { title: 'Billing' }, { title: 'Review' }];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 24, maxWidth: 640 } },
    h(T.Stepper, { steps: steps, current: 2 }),
    h(T.Stepper, { steps: steps.slice(0, 3), current: 1, orientation: 'vertical', size: 'sm' })));
</script>
</body>
</html>
