<!-- @dsCard group="Forms" height=240 subtitle="Native checkbox: sm, md, lg; checked, indeterminate; description; invalid, disabled" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 14px; max-width: 560px; }
  .lbl { width: 80px; flex-shrink: 0; font-size: 12px; line-height: 20px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  function Row(label, kids) { return h('div', { className: 'row' }, h('span', { className: 'lbl' }, label), kids); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    Row('Sizes', [h(T.Checkbox, { key: 1, size: 'sm', defaultChecked: true }, 'Small'), h(T.Checkbox, { key: 2, defaultChecked: true }, 'Medium'), h(T.Checkbox, { key: 3, size: 'lg', defaultChecked: true }, 'Large')]),
    Row('States', [h(T.Checkbox, { key: 1 }, 'Unchecked'), h(T.Checkbox, { key: 2, defaultChecked: true }, 'Checked'), h(T.Checkbox, { key: 3, indeterminate: true }, 'Indeterminate')]),
    Row('Description', h(T.Checkbox, { defaultChecked: true, description: 'Get an email when someone mentions you.' }, 'Mentions')),
    Row('Invalid', h(T.Checkbox, { invalid: true }, 'I accept the terms')),
    Row('Disabled', [h(T.Checkbox, { key: 1, disabled: true }, 'Unchecked'), h(T.Checkbox, { key: 2, disabled: true, defaultChecked: true }, 'Checked')])
  ));
</script>
</body>
</html>
