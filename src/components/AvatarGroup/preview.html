<!doctype html>
<html>
<head><meta charset="utf-8"><title>AvatarGroup — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  var PEOPLE = ['Ada Lovelace', 'Grace Hopper', 'Alan Turing', 'Katherine Johnson', 'Linus Torvalds', 'Margaret Hamilton'];
  function group(size, max) { return h(T.AvatarGroup, { size: size, max: max, label: 'Assigned to' }, PEOPLE.map(function (n) { return h(T.Avatar, { key: n, name: n }); })); }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start' } },
    group('sm', 4), group('md', 4), group('lg')));
</script>
</body>
</html>
