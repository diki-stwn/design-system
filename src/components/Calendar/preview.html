<!doctype html>
<html>
<head><meta charset="utf-8"><title>Calendar — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  var d = new Date(2025, 2, 12);   // a fixed date, so the visual baseline doesn't change from day to day
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Calendar, { defaultValue: d }));
</script>
</body>
</html>
