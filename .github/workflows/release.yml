name: Release

# On main: while changesets are waiting (.changeset/*.md), keeps a "Release" pull request open that turns
# them into the next version (npm run version-packages). Once that pull request is merged, tags the version
# and makes a GitHub release with the package attached (npm run release).
# It runs only after CI has passed on a push to main, and works on the commit CI tested, so a red main
# can't be tagged or released.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'Release: next version'
          commit: 'Release: next version'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
