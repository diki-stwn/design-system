<!-- @dsCard group="Forms" height=160 subtitle="empty, with text and a clear button, and loading" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SearchInput — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .dk-loader * { animation: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 320 } },
    h(T.SearchInput, { 'aria-label': 'Search', placeholder: 'Search projects' }),
    h(T.SearchInput, { 'aria-label': 'Search with text', defaultValue: 'Atlas' }),
    h(T.SearchInput, { 'aria-label': 'Searching', defaultValue: 'Atl', loading: true })));
</script>
</body>
</html>
