<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title>
<style>
  body { margin: 0; padding: 16px 16px 16px 96px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var D = window.Diki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(D.Popover, { title: 'Share', open: true, onOpenChange: function () {}, trigger: h(D.Button, { variant: 'outline', leftIcon: 'share' }, 'Share') },
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } },
        h(D.Field, { label: 'Email' }, h(D.Input, { type: 'email', placeholder: 'name@example.com' })),
        h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: '8px' } }, h(D.Button, { size: 'sm', variant: 'ghost' }, 'Cancel'), h(D.Button, { size: 'sm' }, 'Invite'))))
  );
</script>
</body>
</html>
