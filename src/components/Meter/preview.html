<!doctype html>
<html>
<head><meta charset="utf-8"><title>Meter — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 384 } },
    h(T.Meter, { value: 72, label: 'Storage', showValue: true }),
    h(T.Meter, { value: 88, low: 80, high: 95, optimum: 0, label: 'Storage', showValue: true }),
    h(T.Meter, { value: 12, low: 20, high: 60, optimum: 100, label: 'Battery', showValue: true }),
    h(T.Meter, { value: 50, low: 30, high: 70, label: 'Temperature', showValue: true })));
</script>
</body>
</html>
