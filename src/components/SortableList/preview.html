<!doctype html>
<html>
<head><meta charset="utf-8"><title>SortableList — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  function App() {
    var s = React.useState(['Write the launch brief', 'Review the design tokens', 'Record the demo']);
    return h('div', { style: { maxWidth: '320px' } }, h(T.SortableList, { 'aria-label': 'Launch tasks', items: s[0], onReorder: s[1],
      getKey: function (t) { return t; }, getLabel: function (t) { return t; }, renderItem: function (t) { return t; } }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
