<!doctype html>
<html>
<head><meta charset="utf-8"><title>TimePicker — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root" style="width:220px"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Field, { label: 'Start time' }, h(T.TimePicker, { defaultValue: '09:30', min: '08:00', max: '18:00', locale: 'en-US' })));
  setTimeout(function () { var b = document.querySelector('.dk-time-picker__button'); if (b) b.click(); }, 50);
</script>
</body>
</html>
