<!doctype html>
<html>
<head><meta charset="utf-8"><title>Kbd — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, alignItems: 'flex-start' } },
    h('div', { style: { display: 'flex', gap: 12 } }, h(T.Kbd, null, 'Esc'), h(T.Kbd, { keys: ['ctrl', 'K'] }), h(T.Kbd, { keys: ['shift', 'enter'], size: 'sm' })),
    h('p', { style: { margin: 0, fontSize: 14 } }, 'Press ', h(T.Kbd, null, '/'), ' to search.')));
</script>
</body>
</html>
