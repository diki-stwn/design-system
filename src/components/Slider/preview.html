<!doctype html>
<html>
<head><meta charset="utf-8"><title>Slider — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 24, maxWidth: 320 } },
    h(T.Slider, { 'aria-label': 'Volume', defaultValue: 60 }),
    h(T.Slider, { 'aria-label': 'Price', defaultValue: [25, 75] }),
    h(T.Slider, { 'aria-label': 'Opacity', size: 'sm', defaultValue: 40 })));
</script>
</body>
