<!doctype html>
<html>
<head><meta charset="utf-8"><title>Switch — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 14px; max-width: 600px; }
  .lbl { width: 80px; flex-shrink: 0; font-size: 12px; line-height: 20px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  function Row(label, kids) { return h('div', { className: 'row' }, h('span', { className: 'lbl' }, label), kids); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    Row('Sizes', [h(T.Switch, { key: 1, size: 'sm', defaultChecked: true }, 'Small'), h(T.Switch, { key: 2, defaultChecked: true }, 'Medium'), h(T.Switch, { key: 3, size: 'lg', defaultChecked: true }, 'Large')]),
    Row('States', [h(T.Switch, { key: 1, 'data-visual-target': '' }, 'Off'), h(T.Switch, { key: 2, defaultChecked: true }, 'On')]),
    Row('Description', h(T.Switch, { defaultChecked: true, description: 'Pause notifications from 10 pm to 7 am.' }, 'Quiet hours')),
    Row('Label first', h(T.Switch, { labelPosition: 'start' }, 'Autoplay videos')),
    Row('Invalid', h(T.Switch, { invalid: true }, 'Two-step sign-in')),
    Row('Disabled', [h(T.Switch, { key: 1, disabled: true }, 'Off'), h(T.Switch, { key: 2, disabled: true, defaultChecked: true }, 'On')])
  ));
</script>
</body>
</html>
