<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .dk-dialog__panel { animation: none; }
  .dk-dialog[open]::backdrop { animation: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Dialog, {
    open: true, title: 'Invite people', description: 'They’ll get an email with a link.', size: 'sm',
    footer: [h(T.Button, { key: 1, variant: 'secondary' }, 'Cancel'), h(T.Button, { key: 2 }, 'Send invite')]
  }, h(T.Field, { label: 'Email' }, h(T.Input, { type: 'email', defaultValue: 'ada@example.com' }))));
</script>
</body>
</html>
