<!doctype html>
<html>
<head><meta charset="utf-8"><title>Text — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  #root { display: flex; flex-direction: column; gap: 6px; max-width: 520px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    ['xs', 'sm', 'base', 'lg', 'xl'].map(function (s) { return h(T.Text, { key: s, size: s }, 'text-' + s + ': The quick brown fox'); }),
    ['muted', 'primary', 'danger'].map(function (t) { return h(T.Text, { key: t, size: 'sm', tone: t }, t + ': The quick brown fox'); }),
    h(T.Text, { size: 'sm', weight: 'semibold' }, 'semibold: The quick brown fox'),
    h('div', { style: { width: 200 } }, h(T.Text, { size: 'sm', truncate: true }, 'quarterly-report-final-version-2.pdf'))
  ));
</script>
</body>
</html>
