<!-- @dsCard group="Feedback" height=220 subtitle="bars with a label and value, tones, and rings" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Progress — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .dk-progress__ring, .dk-progress__fill { animation: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 384 } },
    h(T.Progress, { value: 45, label: 'Uploading report.pdf', showValue: true }),
    h(T.Progress, { tone: 'warning', value: 92, label: 'Storage', showValue: true }),
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 16 } },
      h(T.Progress, { variant: 'circle', value: 30, showValue: true, 'aria-label': 'Storage used' }),
      h(T.Progress, { variant: 'circle', size: 'lg', tone: 'success', value: 100, showValue: true, 'aria-label': 'Done' }))));
</script>
</body>
</html>
