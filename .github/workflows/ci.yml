name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Release workflow starts this on the Release pull request's branch: GitHub doesn't run CI for a pull
  # request that a workflow opened or updated, and main needs these checks to merge it.
  workflow_dispatch:

# CI only reads the repository, so a bad test dependency can't push or change pull requests.
permissions:
  contents: read

jobs:
  # Builds the package and Storybook once; every test job downloads them instead of building its own.
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: npm ci would otherwise run the "prepare" build too, and the next step builds.
      - run: npm ci --ignore-scripts
      - name: tokens.css is generated from tokens.json
        run: node tools/tokens/build.mjs --check
      - name: Build the package
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            storybook-static/
          retention-days: 3
          if-no-files-found: error

  # The checks that need neither the build nor a browser, beside the build so they don't wait for it.
  static:
    name: types and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Every file carries the same version
        run: node tools/release.mjs --check
      - name: Type check
        run: npm run typecheck
      - name: Lint (ESLint and Stylelint)
        run: npm run lint

  suite:
    # The suite runs as parallel jobs, one per group (tools/test/run.mjs --group), so a run takes as long as
    # its slowest group instead of all of them in a row.
    name: suite (${{ matrix.group }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Storybook's check (every story in six themes) is the slowest, so it runs as four shards.
        include:
          - { group: checks }
          - { group: components }
          - { group: visual }
          - { group: storybook, shard: 1/4 }
          - { group: storybook, shard: 2/4 }
          - { group: storybook, shard: 3/4 }
          - { group: storybook, shard: 4/4 }
    # Pinned so font rendering, and with it the visual snapshots, stays the same between runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The icon builder and the CSS trimmer the checks group tests are Python.
      - if: matrix.group == 'checks'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build
      - uses: ./.github/actions/playwright
      - name: Test suite
        shell: bash
        env:
          SERUPA_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          node tools/test/run.mjs --group ${{ matrix.group }} 2>&1 | tee test-output.txt
      - name: Show failures on the pull request
        if: failure()
        shell: bash
        run: |
          # One annotation listing the failing tests, so they show on the PR without opening the log.
          # Which groups failed first, then the failing tests (an annotation holds a limited amount of text).
          msg=$( { sed -n '/━━ Summary ━━/,$p' test-output.txt | grep '^FAIL'; echo; grep -E '^(CHANGED|NEW|MISSING|NO EFFECT) ' test-output.txt | head -20; grep -E -A1 '^FAIL' test-output.txt | grep -v '^--$' | head -60; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing tests (${{ matrix.group }})::${msg}"
          { echo '## Failing tests (${{ matrix.group }})'; echo '```'; grep -E -A1 '^FAIL|^(PASS|FAIL)  [A-Z]' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.group }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: |
            test-output.txt
            .test-tmp/
            tools/test/baseline-visual/*.actual.png
          if-no-files-found: ignore

  # The components on React 19: the package built above (its plain-page React stays 18, which has the UMD
  # files dist/lib/ ships), with React 19 in place of 18 for the type check, the component tests and the
  # server render of every component.
  react-19:
    name: React 19
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build
      - uses: ./.github/actions/playwright
      - name: Switch to React 19
        run: npm install --no-save --ignore-scripts react@19.2.9 react-dom@19.2.9 @types/react@19.2.18 @types/react-dom@19.2.3
      - name: Type check
        run: npm run typecheck
      - name: Component tests (Vitest)
        run: npx vitest run
      - name: Package (server render of every component)
        run: node tools/test/package.mjs

  # One check that passes only when every group passed, under the name the single job used to have.
  test:
    needs: [build, static, suite, react-19]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.build.result }}" = success && test "${{ needs.static.result }}" = success && test "${{ needs.suite.result }}" = success && test "${{ needs.react-19.result }}" = success
