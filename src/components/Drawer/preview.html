<!-- @dsCard group="Overlays" height=360 subtitle="open on the right, with a title, fields and actions" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Drawer — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .dk-drawer__panel { animation: none; }
  .dk-drawer[open]::backdrop { animation: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Drawer, {
    open: true, title: 'Filters', description: 'Narrow the list of projects.', size: 'sm',
    footer: [h(T.Button, { key: 1, variant: 'secondary' }, 'Reset'), h(T.Button, { key: 2 }, 'Apply')]
  }, h(T.Field, { label: 'Name' }, h(T.Input, { defaultValue: 'Atlas' }))));
</script>
</body>
</html>
