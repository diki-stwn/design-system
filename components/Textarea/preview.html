<!-- @dsCard group="Forms" height=480 subtitle="Multi-line text field: sm, md, lg; auto-resize; count; invalid, read-only, disabled" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Textarea — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; max-width: 560px; }
  .lbl { width: 80px; flex-shrink: 0; padding-top: 6px; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Diki, h = React.createElement;
  function Row(label, kids) { return h('div', { className: 'row' }, h('span', { className: 'lbl' }, label), kids); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    Row('Sizes', [h(T.Textarea, { key: 1, size: 'sm', rows: 2, placeholder: 'Small', 'aria-label': 'Small' }), h(T.Textarea, { key: 2, rows: 2, placeholder: 'Medium', 'aria-label': 'Medium' }), h(T.Textarea, { key: 3, size: 'lg', rows: 2, placeholder: 'Large', 'aria-label': 'Large' })]),
    Row('Count', h(T.Textarea, { showCount: true, maxLength: 140, defaultValue: 'Shipped the new onboarding flow.', 'aria-label': 'Update' })),
    Row('Auto-resize', h(T.Textarea, { autoResize: true, rows: 2, maxRows: 5, defaultValue: 'Grows as you type, from 2 lines up to 5,\nthen scrolls.', 'aria-label': 'Notes' })),
    Row('Invalid', h(T.Textarea, { invalid: true, rows: 2, defaultValue: 'Too short', 'aria-label': 'Description' })),
    Row('Read-only', h(T.Textarea, { readOnly: true, rows: 2, defaultValue: 'Signed off by Dana Kim on 12 October.', 'aria-label': 'Approval note' })),
    Row('Disabled', h(T.Textarea, { disabled: true, rows: 2, placeholder: 'Not available', 'aria-label': 'Disabled' }))
  ));
</script>
</body>
</html>
